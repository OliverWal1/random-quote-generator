<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quotes & Biographies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container card">

    <div id="quote-box">
        <blockquote id="quote-text">Loading quote...</blockquote>
        <cite id="quote-author"></cite>
    </div>

    <div class="author-details">
        <img id="author-img" src="" alt="Portrait" class="author-avatar">
        <div class="text-content">

            <p id="author-info">Loading biography...</p>
        </div>
    </div>

    <button id="quote-btn">Next Quote</button>
</div>

<script src="script.js"></script>
</body>
</html>
