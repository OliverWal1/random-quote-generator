<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zufällige Zitate & Biografien</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container card">

    <div id="quote-box">
        <blockquote id="quote-text">Lade Zitat...</blockquote>
        <cite id="quote-author"></cite>
    </div>

    <div class="author-details">
        <img id="author-img" src="" alt="Portrait" class="author-avatar">

        <div class="text-content">
            <p id="author-info">Die Zusammenfassung wird geladen...</p>
        </div>
    </div>

    <button id="quote-btn">Nächstes Zitat</button>
</div>

<script src="script.js"></script>
</body>
</html>
